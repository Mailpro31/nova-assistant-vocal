# CI Nova — vérifications légères et déterministes sur Linux.
#
# La suite complète test_modes.py importe winext (API Win32, pywin32/pycaw) et
# ne tourne que sous Windows. Mais classify() est de la logique texte quasi
# pure : le golden master (test_classify_golden.py) l'exerce hors Windows via un
# stub déterministe (cf. _classify_harness). La CI vérifie donc :
#   1. lint ruff (règles à fort signal — cf. pyproject.toml)
#   2. compilation de tous les modules (erreurs de syntaxe / indentation)
#   3. golden master de classify() (497 phrases classées à l'identique)
# Pour la suite complète : sous Windows, `python test_modes.py`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, compile & golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils (ruff épinglé + numpy pour le golden)
        run: pip install "ruff==0.15.8" "numpy>=1.24"

      - name: Lint (ruff)
        run: ruff check .

      - name: Compiler tous les modules Python
        run: python -m compileall -q .

      - name: Golden master de classify()
        run: python test_classify_golden.py
