name: Uptime — surveillance site + backend

# Moniteur de disponibilité « fait maison », gratuit et sans service tiers :
# ping du site et des fonctions edge toutes les 15 min. En cas de panne, ouvre
# un ticket en mentionnant le propriétaire (→ e-mail), et le referme une fois
# rétabli. Les fonctions edge ne répondent qu'en POST : un 404 sur un GET = la
# fonction tourne (sain) ; on n'alerte que sur absence de réponse ou erreur 5xx.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: Mailpro31
    steps:
      - name: Ping des services
        run: |
          set -uo pipefail
          SUPA="https://cvpucqsxgjczkdskohte.supabase.co/functions/v1"
          DOWN=()

          check() {  # nom | url | mode(site|api)
            local name="$1" url="$2" mode="$3" code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
                    --retry 2 --retry-delay 5 "$url" 2>/dev/null || echo 000)
            local ok=1
            if [ "$code" = "000" ]; then ok=0
            elif [ "$mode" = "site" ] && [ "$code" -ge 400 ]; then ok=0
            elif [ "$mode" = "api" ]  && [ "$code" -ge 500 ]; then ok=0
            fi
            echo "$name -> HTTP $code (ok=$ok)"
            [ "$ok" -eq 0 ] && DOWN+=("- **$name** — \`$url\` → HTTP $code")
            return 0
          }

          check "Site (novaspeak.app)" "https://novaspeak.app/"      site
          check "Relais Turbo"         "$SUPA/turbo"                  api
          check "Vision cloud"         "$SUPA/turbo-vision"           api
          check "Licences"             "$SUPA/license"                api

          # Incident ouvert éventuel (titre préfixé [uptime]).
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
                  --json number,title \
                  --jq '[.[]|select(.title|startswith("[uptime]"))][0].number // empty')

          if [ "${#DOWN[@]}" -gt 0 ]; then
            printf 'Services HS détectés le %s :\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" > body.md
            printf '%s\n' "${DOWN[@]}" >> body.md
            printf '\ncc @%s\n' "$OWNER" >> body.md
            if [ -z "$num" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "[uptime] Panne détectée" --body-file body.md
            else
              echo "Incident #$num déjà ouvert — pas de doublon."
            fi
            echo "::error::Panne détectée sur un ou plusieurs services."
            exit 1
          else
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
                --body "Rétabli le $(date -u '+%Y-%m-%d %H:%M UTC') — tous les services répondent."
              gh issue close "$num" --repo "$GITHUB_REPOSITORY"
            fi
            echo "Tous les services répondent."
          fi
