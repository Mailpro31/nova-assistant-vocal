 * 19 plans courts (42 s) : montage rapide, vrais écrans de l'app,
 * micro-animations partout. Tout est dessiné analytiquement depuis le
 * temps t : seek(t) produit exactement la même image (capture frame par
 * frame via render.py). Rendu 1600×900 ; coordonnées logiques 1280×720.
 * ------------------------------------------------------------------ */

X.scale(SCALE,SCALE);

const BLUE = "#0A84FF", BLUE_RGB = [10,132,255], OK = "#30D158";
const INK = "#F3F3F6", MUT = "#9A9AA6", DIM = "#6E6E7A";

const FONT = '"Inter","Helvetica Neue","Liberation Sans","DejaVu Sans",Arial,sans-serif';

/* ---- utilitaires ---- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const mix = (c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
const rgba = (c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const eOut = t=>1-Math.pow(1-t,3);
const eIn  = t=>t*t*t;
const eInOut = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack = t=>{const c=1.70158,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const eSpring = t=>{t=clamp(t,0,1);return 1-Math.exp(-6*t)*Math.cos(9*t);};
function seg(t,a,b,fin=.3,fout=.3){
  if(t<a||t>b) return 0;
  const d=b-a, u=(t-a)/d, fi=fin/d, fo=fout/d;
  let v=1;
  if(u<fi) v=eOut(u/fi);
  if(u>1-fo) v=Math.min(v,eOut((1-u)/fo));
  return v;
}
const loc = (t,a,b)=>clamp((t-a)/(b-a),0,1);

/* PRNG déterministe (mulberry32) */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}

/* particules de l'orbe */
const NP = 150, R0 = rng(7);
const PT = Array.from({length:NP},()=>({
  a: R0()*Math.PI*2, r: .55+R0()*1.9, ph: R0()*Math.PI*2,
  sp: .6+R0()*1.1, sz: .6+R0()*1.8, tw: R0()
}));
/* poussière ambiante (profondeur) */
const RD = rng(41);
const DUST = Array.from({length:42},()=>({
  x: RD()*W, y: RD()*H, s: .7+RD()*1.6, v: 3+RD()*8, ph: RD()*Math.PI*2, a: .05+RD()*.10
}));

};
let T = L.fr;
window.setLang = l => { T = L[l] || L.fr; document.documentElement.lang = l; };

/* ---- timeline (secondes) — 19 plans, 42 s ---- */
const S = {
  mat:   [0.0, 1.7],
  tag:   [1.7, 3.5],
  key:   [3.5, 5.0],
  listen:[5.0, 7.2],
  pop:   [7.2, 9.4],
  chat:  [9.4, 11.2],
  todo:  [11.2, 13.0],
  prompt:[13.0, 14.8],
  sty:   [14.8, 17.9],
  auto:  [17.9, 19.9],
  models:[19.9, 23.1],
  custom:[23.1, 24.9],
  priv:  [24.9, 27.0],
  turbo: [27.0, 28.8],
  every: [28.8, 30.8],
  stat:  [30.8, 33.2],
  week:  [33.2, 35.4],
  upd:   [35.4, 36.9],
  end:   [36.9, 42.0]
};
window.DUR = 42.0;
/* coupes (transitions) — les étincelles visuelles et les whooshs audio y sont calés */
const CUTS = [1.7,3.5,5.0,7.2,9.4,11.2,13.0,14.8,17.9,19.9,23.1,24.9,27.0,28.8,30.8,33.2,35.4,36.9];

/* ---- image réelle de l'app (collection de modèles) ---- */
const IMG_MODELS = new Image();
IMG_MODELS.src = "assets/shot-models.png";

/* ================= helpers de dessin ================= */
function setFont(px,weight=600,spacing=-.5){
  X.font = `${weight} ${px}px ${FONT}`;
  X.textAlign="center"; X.textBaseline="alphabetic";
  try{ X.letterSpacing = spacing+"px"; }catch(e){}
}
function bg(t){
  const g = X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,BG0); g.addColorStop(.5,BG1); g.addColorStop(1,BG2);
  X.fillStyle=g; X.fillRect(0,0,W,H);
  const halo=(cx,cy,rad,col,al)=>{
    const rg=X.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,rgba(col,al)); rg.addColorStop(1,rgba(col,0));
    X.fillStyle=rg; X.fillRect(0,0,W,H);
  };
  const dr=t*0.13;
  halo(W*(.30+.02*Math.sin(dr)),H*(.32+.02*Math.cos(dr*.9)),520,PERI,.16);
  halo(W*(.72+.02*Math.cos(dr*1.1)),H*(.66+.02*Math.sin(dr)),560,LAV,.13);
  halo(W*.52,H*.5,700,MINT,.05);
  /* poussière ambiante — dérive lente vers le haut, scintillement doux */
  for(const d of DUST){
    const y=((d.y - t*d.v)%H+H)%H;
    const tw=.5+.5*Math.sin(t*1.3+d.ph);
    X.fillStyle=rgba(PERI,d.a*tw);
    X.beginPath();X.arc(d.x,y,d.s,0,7);X.fill();
  }
  const vg=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.55)");
  X.fillStyle=vg; X.fillRect(0,0,W,H);
}
/* étincelles de coupe : petite gerbe radiale + trait de lumière au changement de plan */
const CUT_RNG = CUTS.map((c,i)=>rng(100+i));
function cutSparks(t){
  for(let i=0;i<CUTS.length;i++){
    const c=CUTS[i], u=(t-c)/0.5;
    if(u<=0||u>=1) continue;
    const R=rng(300+i);
    const cx=W/2, cy=H*.46;
    X.save();
    /* trait horizontal qui traverse (très rapide, discret) */
    const lx=lerp(-200,W+200,eOut(u));
    const lg=X.createLinearGradient(lx-220,0,lx+220,0);
    lg.addColorStop(0,"rgba(255,255,255,0)");
    lg.addColorStop(.5,rgba(mix(PERI,[255,255,255],.5),.10*(1-u)));
    lg.addColorStop(1,"rgba(255,255,255,0)");
    X.fillStyle=lg; X.fillRect(lx-220,0,440,H);
    /* gerbe de 10 étincelles */
    for(let k=0;k<10;k++){
      const ang=R()*Math.PI*2, sp=90+R()*220;
      const px=cx+Math.cos(ang)*sp*eOut(u), py=cy+Math.sin(ang)*sp*eOut(u)*.6;
      X.fillStyle=rgba(mix(PERI,LAV,R()),.5*(1-u));
      X.beginPath();X.arc(px,py,1.4+R()*1.6*(1-u),0,7);X.fill();
    }
    X.restore();
  }
}
/* glint : petit éclat 4 branches */
function glint(x,y,s,a,rot=0){
  if(a<=0)return;
  X.save();X.translate(x,y);X.rotate(rot);X.globalAlpha=a;
  const g=X.createRadialGradient(0,0,0,0,0,s);
  g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"rgba(255,255,255,0)");
  X.fillStyle=g;
  X.beginPath();
  for(let i=0;i<4;i++){
    const A=i*Math.PI/2;
    X.moveTo(0,0);
    X.quadraticCurveTo(Math.cos(A+.5)*s*.18,Math.sin(A+.5)*s*.18,Math.cos(A)*s,Math.sin(A)*s);
    X.quadraticCurveTo(Math.cos(A-.5)*s*.18,Math.sin(A-.5)*s*.18,0,0);
  }
  X.fill();X.restore();
}
function orb(cx,cy,r,t,glow=1,hue=0){
  X.save();
  const col = hue<0?mix(PERI,LAV,-hue):mix(PERI,MINT,hue);
  let rg=X.createRadialGradient(cx,cy,r*.2,cx,cy,r*2.6);
  rg.addColorStop(0,rgba(col,.42*glow)); rg.addColorStop(1,rgba(col,0));
  X.fillStyle=rg; X.beginPath(); X.arc(cx,cy,r*2.6,0,7); X.fill();
  const bx=cx-r*.32, by=cy-r*.36;
  rg=X.createRadialGradient(bx,by,r*.1,cx,cy,r*1.06);
  rg.addColorStop(0,"rgba(255,255,255,.96)");
  rg.addColorStop(.18,rgba(mix(col,[255,255,255],.5),.95));
  rg.addColorStop(.6,rgba(col,.9));
  rg.addColorStop(1,rgba(mix(col,[20,22,34],.6),.95));
  X.fillStyle=rg; X.beginPath(); X.arc(cx,cy,r,0,7); X.fill();
  const ca=t*1.1;
  const ix=cx+Math.cos(ca)*r*.28, iy=cy+Math.sin(ca*1.3)*r*.24;
  rg=X.createRadialGradient(ix,iy,0,ix,iy,r*.8);
  rg.addColorStop(0,rgba(mix(col,[255,255,255],.7),.5));
  rg.addColorStop(1,rgba(col,0));
  X.fillStyle=rg; X.beginPath(); X.arc(cx,cy,r,0,7); X.fill();
  X.lineWidth=Math.max(1,r*.03);
  X.strokeStyle=rgba(mix(col,[255,255,255],.6),.5);
  X.beginPath(); X.arc(cx,cy,r*.985,0,7); X.stroke();
  const sx=cx-r*.34, sy=cy-r*.42;
  rg=X.createRadialGradient(sx,sy,0,sx,sy,r*.5);
  rg.addColorStop(0,"rgba(255,255,255,.95)"); rg.addColorStop(1,"rgba(255,255,255,0)");
  X.fillStyle=rg; X.beginPath(); X.ellipse(sx,sy,r*.34,r*.22,-.5,0,7); X.fill();
  X.restore();
}
function particles(cx,cy,r,t,p,alpha=1){
  X.save();
  for(const q of PT){
    const conv = eOut(clamp(p,0,1));
    const rad = lerp(q.r*r*2.7, r*(.9+.14*Math.sin(t*q.sp+q.ph)), conv);
    const ang = q.a + t*.25*q.sp + (1-conv)*q.ph;
    const x = cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
    const tw = .45+.55*Math.abs(Math.sin(t*2*q.sp+q.tw*6));
    const col = mix(PERI,LAV,q.tw);
    X.fillStyle=rgba(col,tw*alpha*lerp(.9,.5,conv));
    X.beginPath(); X.arc(x,y,q.sz*lerp(1.1,.7,conv),0,7); X.fill();
  }
  X.restore();
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  X.beginPath();
  if(X.roundRect){ X.roundRect(x,y,w,h,r); }
  else{
    X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r);
    X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath();
  }
}
function card(x,y,w,h,r,a=1,fill="rgba(28,29,37,.92)"){
  X.save(); X.globalAlpha=a;
  X.shadowColor="rgba(0,0,0,.5)"; X.shadowBlur=40; X.shadowOffsetY=24;
  X.fillStyle=fill; rr(x,y,w,h,r); X.fill();
  X.shadowColor="transparent";
  X.lineWidth=1; X.strokeStyle="rgba(255,255,255,.08)"; rr(x+.5,y+.5,w-1,h-1,r); X.stroke();
  X.restore();
}
function text(str,x,y,px,weight,col,spacing=-.5,align="center",alpha=1){
  X.save(); X.globalAlpha=alpha; setFont(px,weight,spacing);
  X.textAlign=align; X.fillStyle=col; X.fillText(str,x,y); X.restore();
}
function typed(str,p){
  const n=Math.round(str.length*clamp(p,0,1));
  return str.slice(0,n);
}
function wrapText(str,x,y,maxw,lh,px,weight,col,align){
  X.save(); setFont(px,weight,-.3); X.textAlign=align||"left"; X.fillStyle=col;
  const words=str.split(" "); let line="", yy=y;
  for(const w of words){
    const test=line?line+" "+w:w;
    if(X.measureText(test).width>maxw && line){ X.fillText(line,x,yy); line=w; yy+=lh; }
    else line=test;
  }
  if(line)X.fillText(line,x,yy);
  X.restore();
  return yy;
}
/* la bulle réelle : pastille + 9 barres arrondies + minuteur + croix */
function novaPill(cx,cy,t,a,timer){
  X.save();X.globalAlpha=a;
  const w=250,h=52,x=cx-w/2,y=cy-h/2;
  X.fillStyle="rgba(18,19,25,.97)"; X.shadowColor="rgba(0,0,0,.5)";X.shadowBlur=30;X.shadowOffsetY=12;
  rr(x,y,w,h,26);X.fill();X.shadowColor="transparent";
  X.strokeStyle="rgba(255,255,255,.1)";X.lineWidth=1;rr(x+.5,y+.5,w-1,h-1,26);X.stroke();
  /* pastille du Style (rose e-mail) */
  X.fillStyle=rgba(ROSE,1);X.beginPath();X.arc(x+26,cy,6.5,0,7);X.fill();
  /* 9 barres (comme l'overlay réel) */
  const n=9, bw=5, gap=8, tot=n*bw+(n-1)*gap, sx=cx-tot/2+6;
  for(let i=0;i<n;i++){
    const env=Math.sin((i+.5)/n*Math.PI);
    const hh=4+env*15*(.35+.65*Math.abs(Math.sin(t*5.6+i*.9)+.4*Math.sin(t*3.1+i*1.7)));
    X.fillStyle=rgba(mix(PERI,MINT,i/n),.95);
    rr(sx+i*(bw+gap),cy-hh/2,bw,hh,bw/2);X.fill();
  }
  /* minuteur + croix */
  text(timer,x+w-52,cy+4.5,12.5,600,MUT,.2,"center");
  X.strokeStyle="rgba(255,255,255,.45)";X.lineWidth=1.6;X.lineCap="round";
  X.beginPath();X.moveTo(x+w-26,cy-4);X.lineTo(x+w-18,cy+4);
  X.moveTo(x+w-18,cy-4);X.lineTo(x+w-26,cy+4);X.stroke();
  X.restore();
}
/* petite pilule bleue « Style · X » */
function styTag(x,y,label,a){
  X.save();X.globalAlpha=a;
  setFont(11.5,600,.2);
  const w=X.measureText(label).width+26;
  X.fillStyle="rgba(10,132,255,.13)";
  rr(x-w,y-13,w,26,13);X.fill();
  X.strokeStyle="rgba(10,132,255,.3)";X.lineWidth=1;rr(x-w+.5,y-12.5,w-1,25,13);X.stroke();
  X.fillStyle="#6FB4FF";X.textAlign="center";X.fillText(label,x-w/2,y+4);
  X.restore();
}
/* coche verte animée (p 0→1) */
function check(gx,gy,p,a,rad=16){
  if(p<=0)return;
  const ck=eBack(clamp(p,0,1));
  X.save();X.globalAlpha=a;
  X.fillStyle=rgba([48,209,88],.16);X.beginPath();X.arc(gx,gy,rad*ck,0,7);X.fill();
  X.strokeStyle=OK;X.lineWidth=2.6;X.lineCap="round";
  X.beginPath();X.moveTo(gx-rad*.38*ck,gy);X.lineTo(gx-rad*.06*ck,gy+rad*.3*ck);X.lineTo(gx+rad*.44*ck,gy-rad*.38*ck);X.stroke();
  X.restore();
}
/* gerbe d'étincelles ponctuelle (winglet) */
function burst(cx,cy,t0,t,seed,col=PERI,n=12,spread=90){
  const u=(t-t0)/0.6; if(u<=0||u>=1)return;
  const R=rng(seed);
  X.save();
  for(let k=0;k<n;k++){

function cursorPos(pts,t){
  if(t<=pts[0].t) return {x:pts[0].x,y:pts[0].y};
  for(let i=0;i<pts.length-1;i++){
    if(t>=pts[i].t&&t<=pts[i+1].t){
      const u=eInOut((t-pts[i].t)/(pts[i+1].t-pts[i].t));
      return {x:lerp(pts[i].x,pts[i+1].x,u), y:lerp(pts[i].y,pts[i+1].y,u)};
    }
  }
  return {x:pts[pts.length-1].x,y:pts[pts.length-1].y};
}
function drawCursor(t){
  for(const tr of CURSOR){
    const a=tr.pts[0].t, b=tr.pts[tr.pts.length-1].t;
    if(t<a-tr.fade||t>b+tr.fade) continue;
    const p=cursorPos(tr.pts,clamp(t,a,b));

    if(t<a) alpha=eOut((t-(a-tr.fade))/tr.fade);

        X.beginPath();X.arc(p.x,p.y,6+rp*22,0,7);X.stroke();X.restore();
      }
    }
    X.save();X.globalAlpha=alpha;
    const s=1-press*0.2;
    X.translate(p.x,p.y);X.scale(s,s);
    X.shadowColor="rgba(0,0,0,.4)";X.shadowBlur=6;X.shadowOffsetY=2;
    X.beginPath();
    X.moveTo(0,0);X.lineTo(0,17.5);X.lineTo(4.6,13.4);X.lineTo(7.4,19.6);
    X.lineTo(9.9,18.4);X.lineTo(7.1,12.4);X.lineTo(12.3,12.2);X.closePath();
    X.fillStyle="#fff";X.fill();
    X.shadowColor="transparent";
    X.strokeStyle="rgba(0,0,0,.55)";X.lineWidth=1.4;X.stroke();
    X.restore();
  }
}

/* ================= rendu d'une image ================= */
function frame(t){
  t=clamp(t,0,window.DUR);
  bg(t);
  scMaterialize(t); scTag(t); scKey(t); scListen(t); scPop(t);
  scChat(t); scTodo(t); scPrompt(t); scStyles(t); scAuto(t);
  scModels(t); scCustom(t); scPriv(t); scTurbo(t);
  scEvery(t); scStat(t); scWeek(t); scUpd(t); scEnd(t);
  cutSparks(t);
  drawCursor(t);
  if(t<.5){ X.fillStyle=`rgba(0,0,0,${1-eOut(t/.5)})`; X.fillRect(0,0,W,H); }
  if(t>window.DUR-.7){ X.fillStyle=`rgba(0,0,0,${eIn(clamp((t-(window.DUR-.7))/.7,0,1))})`; X.fillRect(0,0,W,H); }
}
window.seek = t => frame(t);
window.frame = frame;

/* aperçu autonome (hors capture) : lecture en boucle */
let _raf=null, _t0=null;
function play(ts){
  if(_t0===null)_t0=ts;
  const t=((ts-_t0)/1000)%window.DUR;
  frame(t);
  _raf=requestAnimationFrame(play);
}
function start(){
  if(!location.search.includes("capture")){ _raf=requestAnimationFrame(play); }
  else { frame(0); }
  window.__ready=true;
}
if(IMG_MODELS.complete) start();
else { IMG_MODELS.onload=start; IMG_MODELS.onerror=()=>{ console.error("shot-models.png introuvable"); start(); }; }
</script>
