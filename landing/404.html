<style>

    background:#1F1F22;color:#F2F2F4;font-family:var(--font);padding:20px;text-align:center}
  .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 18px;

  h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
  p{color:#98989F;font-size:13.5px;line-height:1.6;margin-bottom:22px}
  .en{font-size:12px;color:#6E6E76;margin-top:14px}
  .btn{display:inline-block;background:#0A84FF;color:#fff;border-radius:8px;
    padding:11px 22px;font-size:13.5px;font-weight:600;text-decoration:none}
  .btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>Cette page n'existe pas.</h1>
