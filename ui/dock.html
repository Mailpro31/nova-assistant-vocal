<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nova</title>
<style>
  :root{--txt:#F1F3FA;--txt2:#AAB2C4;--txt3:#7C8398;--edge:rgba(255,255,255,.12);
    --edge2:rgba(255,255,255,.20);
    --peri:#AEBEEC;--peri-d:#93A6E0;--lav:#C7B9EA;--mint:#AEE2CC;--mint-d:#8FCFB2;
    --font:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  /* fond OPAQUE : la fenêtre est découpée par une région native aux formes
     visibles (voir reportShape) — la transparence WebView2 n'est jamais
     requise, donc jamais de carré blanc. */
  html,body{width:100%;height:100%;overflow:hidden;background:#101218;font-family:var(--font);
    color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}

  /* ---- le dock flottant (bas-centre) ---- */
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;border-radius:28px;
    background:rgba(18,20,26,.72);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 44px rgba(0,0,0,.55)}
  .z{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .z:hover{background:rgba(255,255,255,.06)}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.1)}
  .gi{width:19px;height:19px;color:var(--txt2);stroke:currentColor;fill:none;stroke-width:1.6}
  #orb{width:40px;height:40px;display:block}

  /* ---- bulle d'état AU-DESSUS du dock (jamais sur l'orbe) ---- */
  #bubble{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(6px);
    max-width:340px;padding:10px 17px;border-radius:999px;font-size:13px;white-space:nowrap;
    display:flex;align-items:baseline;
    background:rgba(20,23,32,.82);border:1px solid var(--edge);color:#ECEFF7;
    -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 12px 34px #0009;opacity:0;pointer-events:none;transition:.28s var(--ease)}
  #bubble.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* un long texte dicté ne déborde JAMAIS : points de suspension */
  #bubble #bubText{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bubble .sub{color:var(--txt3);font-size:11px;margin-left:8px;flex:none}
  /* ancrage en HAUT de l'écran : bulle et menu passent SOUS le dock */
  body.pos-top #dock{bottom:auto;top:14px}
  body.pos-top #bubble{bottom:auto;top:80px}
  body.pos-top #bubble{transform:translateX(-50%) translateY(-6px)}
  body.pos-top #bubble.on{transform:translateX(-50%) translateY(0)}
  body.pos-top #modes{bottom:auto;top:80px}
  #bubble.ok{border-color:rgba(174,226,204,.5)} #bubble.error{border-color:rgba(232,190,170,.5)}

  /* ---- menu des modes ---- */
  #modes{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);width:262px;
    background:rgba(20,23,32,.86);border:1px solid var(--edge);border-radius:24px;padding:8px;
    -webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);
    box-shadow:0 28px 66px #000b;display:none}
  #modes.on{display:block;animation:pop .34s var(--spring)}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.96)}
    to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  .mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;cursor:pointer;
    font-size:13.5px;transition:background .25s var(--ease)}
  .mrow:hover{background:rgba(255,255,255,.06)}
  .mrow.act{background:rgba(174,190,236,.14);box-shadow:0 0 0 1px rgba(174,190,236,.3) inset}
  .mg{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .mg svg{width:16px;height:16px;stroke:#11131c;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chk{margin-left:auto;color:var(--mint-d);display:flex}
  .chk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- réglages : fenêtre style Réglages macOS (barre latérale + contenu).
     La webview est redimensionnée en 880×620 : #settings EST la fenêtre. ---- */
  #settings{position:fixed;inset:0;display:none;border-radius:13px;overflow:hidden;
    background:#1f1f22;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 30px 80px rgba(0,0,0,.7)}
  #settings.on{display:flex;animation:fadein .35s var(--ease)}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #side{width:212px;flex:none;background:#28282c;border-right:1px solid rgba(0,0,0,.35);
    padding:12px 10px;display:flex;flex-direction:column;overflow:hidden}
  /* feux tricolores macOS : glyphes révélés au survol du groupe, comme Apple */
  #traffic{display:flex;gap:8px;margin:2px 4px 12px;flex:none;align-self:flex-start}
  .tl{width:13px;height:13px;border-radius:50%;border:none;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
  .tl.red{background:#FF5F57}.tl.yel{background:#FEBC2E}.tl.grn{background:#28C840}
  .tl svg{width:8px;height:8px;stroke:rgba(0,0,0,.6);stroke-width:1.6;fill:none;
    stroke-linecap:round;opacity:0;transition:opacity .12s}
  #traffic:hover .tl svg{opacity:1}
  input[type=range].rng{-webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:2px;
    background:#3a3a3f;outline:none;accent-color:#0A84FF}
  input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer}
  #search{display:flex;align-items:center;gap:6px;background:#1a1a1d;border:1px solid rgba(255,255,255,.055);
    border-radius:7px;padding:5px 8px;margin-bottom:12px}
  #search input{background:none;border:none;outline:none;color:var(--txt);font-size:12.5px;width:100%;font-family:inherit}
  #search input::placeholder{color:#7c7c84}
  #meRow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;margin-bottom:10px}
  #meRow .morb{width:38px;height:38px;border-radius:50%;flex:none;
    background:radial-gradient(40% 36% at 40% 30%,#fff 0%,#cfd8ee 32%,#9db0dd 64%,#6a7aac 100%);
    box-shadow:0 3px 10px rgba(110,130,200,.45),inset 0 -3px 6px rgba(55,65,105,.5)}
  #meRow b{font-size:13.5px;display:block} #meRow small{font-size:11px;color:#98989f}
  .nitem{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;font-size:13px;cursor:pointer}
  .nitem:hover{background:rgba(255,255,255,.05)} .nitem.on{background:#0A84FF;color:#fff}
  .nic{width:21px;height:21px;border-radius:5.5px;flex:none;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.35)}
  .nic svg{width:12.5px;height:12.5px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #paneWrap{flex:1;overflow-y:auto;padding:20px 28px 26px;user-select:text}
  #paneWrap::-webkit-scrollbar{width:8px} #paneWrap::-webkit-scrollbar-thumb{background:#ffffff1a;border-radius:8px}
  #paneWrap h1{font-size:19px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
  .glabel{font-size:11px;font-weight:700;letter-spacing:.6px;color:#7c7c84;text-transform:uppercase;margin:0 2px 6px}
  .group{background:#2c2c30;border:1px solid rgba(255,255,255,.055);border-radius:10px;margin-bottom:6px;overflow:hidden}
  .foot{font-size:11px;color:#7c7c84;line-height:1.5;margin:6px 4px 15px}
  .row{display:flex;align-items:center;min-height:44px;padding:8px 14px;gap:12px}
  .row+.row{border-top:1px solid rgba(255,255,255,.055)}
  .row .l{min-width:0} .row .l b{font-size:13px;font-weight:600;display:block}
  .row .l small{font-size:11.5px;color:#98989f;display:block;margin-top:2px;line-height:1.4}
  .row .r{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
  .val{font-size:13px;color:#98989f}
  .btn{border:0;border-radius:6px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#2f96ff,#0a7aef);color:#fff;

  .btn:active{filter:brightness(.88)}
  .btn.sec{background:#3a3a3f;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.09)}

  .cbox b{font-size:15px;color:#f2f2f4;display:block;margin-bottom:8px}
  .cbox p{font-size:12.5px;color:#98989f;line-height:1.5;margin:0 0 16px}
  .cbtns{display:flex;justify-content:flex-end;gap:8px}
  .sw{width:38px;height:22px;border-radius:999px;background:#3a3a3f;position:relative;flex:none;cursor:pointer;

  .sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:19px;height:19px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:left .25s var(--spring)}
  .sw.on{background:#0A84FF}.sw.on::after{left:17.5px}
  .fieldc{background:#1a1a1d;border:1px solid rgba(255,255,255,.075);border-radius:6px;color:var(--txt);
    padding:5px 10px;font-size:12.5px;font-family:inherit;outline:none}
  .fieldc:focus{border-color:#0A84FF;box-shadow:0 0 0 2.5px rgba(10,132,255,.28)}
  textarea.fieldc{resize:none;width:100%;line-height:1.45}
  select.fieldc{-webkit-appearance:none;appearance:none;cursor:pointer;padding-right:28px;min-width:150px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="16" height="16" rx="4" fill="%230A84FF"/><path d="m5 6.6 3-3 3 3M5 9.4l3 3 3-3" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat:no-repeat;background-position:right 4px center}
  .dotc{width:11px;height:11px;border-radius:50%;flex:none}
  .check{width:16px;height:16px;border-radius:50%;background:#30d158;display:inline-flex;
    align-items:center;justify-content:center;flex:none}
  .check svg{width:9px;height:9px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .plans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px}
  .plan{border:1px solid rgba(255,255,255,.075);border-radius:9px;background:#242428;padding:11px;position:relative}
  .plan b{font-size:12.5px;display:block} .plan small{font-size:10.5px;color:#98989f;display:block;margin-top:3px;line-height:1.35}
  .plan.sel{border-color:#0A84FF;box-shadow:0 0 0 1px #0A84FF}
  .plan.sel::after{content:"";position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;
    background:#0A84FF url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center/8px no-repeat}
  .meter{height:5px;border-radius:3px;background:#1a1a1d;overflow:hidden;width:100%;margin-top:7px}
  .meter i{display:block;height:100%;background:#0A84FF;border-radius:3px}
  .badge-lock{font-size:10px;font-weight:700;color:#c9b6f0;background:rgba(150,120,220,.16);
    border:1px solid rgba(150,120,220,.32);padding:2.5px 8px;border-radius:999px;letter-spacing:.4px}
  /* bloc gaté : tout le sous-arbre grisé et inerte (contrôles ET champs de
     formulaire, qui ne sont pas tous dans .r) — l'UI ne « ment » pas */
  .locked{opacity:.4;pointer-events:none}
  .locked input,.locked textarea,.locked select{pointer-events:none}
  .navempty{padding:16px 10px;font-size:12px;color:#7c7c84;text-align:center;line-height:1.5}
  .err{color:#ff8a80;font-size:11.5px;margin:6px 4px 0}
  .mono{font-family:"SF Mono","Liberation Mono",Menlo,Consolas,monospace}
  .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid #6a6a70;flex:none;position:relative}
  .row.sel .radio{border-color:#0A84FF;background:#0A84FF}
  .row.sel .radio::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:#fff}
  .row.dis{opacity:.4}
  .xdel{background:none;border:none;color:#7c7c84;cursor:pointer;display:flex;padding:3px;border-radius:6px}
  .xdel:hover{color:#ff8a80;background:rgba(255,90,80,.12)}
  .xdel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
</style>

<body>
  <div id="bubble"><span id="bubText">Prête</span><span class="sub" id="bubSub"></span></div>

  <div id="modes"></div>

  <div id="dock">
    <div class="z" id="gear" title="Réglages"><svg class="gi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 2h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 22h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/></svg></div>
    <div class="sep"></div>
    <div class="z"><canvas id="orb"></canvas></div>
    <div class="sep"></div>
    <div class="z" id="modesBtn" title="Style"><svg class="gi" viewBox="0 0 24 24"><path d="M12 3l1.6 3.8L17.5 8l-2.8 2.7.7 4-3.4-1.9L8.6 14.7l.7-4L6.5 8z"/></svg></div>
  </div>

  <div id="settings">

        <button class="tl yel" id="tlMin" title="Réduire"><svg viewBox="0 0 8 8"><path d="M1.4 4h5.2"/></svg></button>

        <input id="searchIn" placeholder="Rechercher" spellcheck="false">

<script>
// tout appel au pont résout TOUJOURS (null en cas d'échec) — jamais de rejet
// non rattrapé : un except Python imprévu ne doit pas figer l'UI (ex. engrenage)
function api(m){try{return Promise.resolve(window.pywebview.api[m].apply(null,[].slice.call(arguments,1)))
    .catch(function(){return null;});}
  catch(e){return Promise.resolve(null);}}
let S={modes:[],profiles:[],languages:[],mode:'auto',ptt_key:'f9',mode_hotkeys:{},menu_hotkey:'',language:'fr',cloud_enabled:false,autostart:false,auto_update:true,app_version:'',
  dock_prefs:{position:'bottom-center',scale:1,opacity:1},
  personal:{},custom_vars:[],hardware:{},tier:'free',lic:null,perso:{},custom_modes:[],
  best_ai:false,orb_color:'',custom_name:''};

// ---------- états poussés par Python ----------
let hideT=null;
window.novaShow=function(state,text,sub){
  clearTimeout(hideT);
  document.getElementById('bubText').textContent=text||({repos:'Prête',listening:"Je t'écoute…",thinking:'Un instant…',ok:'Collé',error:'—'}[state]||'');
  document.getElementById('bubSub').textContent=sub||'';
  const bb=document.getElementById('bubble');bb.className='on'+(state==='ok'?' ok':state==='error'?' error':'');
  ORB.setState(state);
  reportShape();
};
window.novaHide=function(ms){clearTimeout(hideT);hideT=setTimeout(()=>{document.getElementById('bubble').classList.remove('on');ORB.setState('repos');reportShape();},ms||0);};
window.novaLevel=function(rms){ORB.level(rms);};
window.__openSettings=function(){openSettings();};
window.novaOpenModes=function(){const m=document.getElementById('modes');
  if(!m.classList.contains('on'))document.getElementById('modesBtn').onclick();};

// ---------- formes visibles → région native de la fenêtre ----------
// La fenêtre est opaque : Python la découpe aux formes rapportées ici. Appelé
// à chaque changement visuel (bulle, menu, réglages, resize). Double rAF pour
// mesurer APRÈS la mise en page.
function reportShape(){requestAnimationFrame(()=>requestAnimationFrame(()=>{
  try{
    const shapes=[];
    const SET=document.getElementById('settings');
    if(SET.classList.contains('on')){
      shapes.push({x:0,y:0,w:innerWidth,h:innerHeight,r:13});
    }else{
      const add=(el,r)=>{const b=el.getBoundingClientRect();
        if(b.width>1&&b.height>1)shapes.push({x:b.x,y:b.y,w:b.width,h:b.height,
          r:(r==null?b.height/2:r)});};
      add(document.getElementById('dock'));
      const bb=document.getElementById('bubble');
      if(bb.classList.contains('on'))add(bb);
      const mm=document.getElementById('modes');
      if(mm.classList.contains('on'))add(mm,24);
      const cm=document.querySelector('.cmask .cbox');
      if(cm){shapes.length=0;shapes.push({x:0,y:0,w:innerWidth,h:innerHeight,r:13});}
    }
    api('shape',{vw:innerWidth,vh:innerHeight,shapes:shapes});
  }catch(_e){}
}));}
addEventListener('resize',reportShape);

// ---------- préférences de la bulle : ancrage / taille appliqués côté page ----------
function applyDockPrefs(){
  const p=S.dock_prefs||{};
  document.body.classList.toggle('pos-top',String(p.position||'').indexOf('top')===0);
  const z=(p.scale&&p.scale!==1)?String(p.scale):'';
  ['dock','bubble','modes'].forEach(id=>{document.getElementById(id).style.zoom=z;});
  reportShape();
}

// capture d'une touche/combinaison dans un champ : Tab déplace le focus (pas de
// piège), Échap annule, Retour arrière/Suppr efface si `clearable` ; les noms
// DOM sont traduits vers ceux de la lib clavier et on ne lie QUE des touches
// reconnues (sinon la lib échoue en silence → raccourci mort)
function bindKeyCapture(el,clearable,set){
  el.addEventListener('keydown',e=>{
    const raw=e.key||'';
    if(raw==='Tab')return;                       // laisse la tabulation naviguer
    e.preventDefault();
    if(raw==='Escape'){el.blur();return;}        // annule la capture, ne lie rien
    if(clearable&&(raw==='Backspace'||raw==='Delete')){el.value='';set('');return;}
    const MAP={'arrowleft':'left','arrowright':'right','arrowup':'up','arrowdown':'down',
      ' ':'space','spacebar':'space','control':'ctrl','pageup':'page up','pagedown':'page down',
      'meta':'windows','os':'windows','contextmenu':'menu'};
    let k=raw.toLowerCase();k=MAP[k]||k;
    const OK=['left','right','up','down','space','ctrl','alt','shift','enter','home',
      'end','delete','insert','page up','page down','windows','menu','backspace'];
    if(k.length===1||/^f\d{1,2}$/.test(k)||OK.indexOf(k)>=0){
      // combinaison : les modificateurs TENUS se préfixent à la touche pressée
      // (ex. Ctrl maintenu + Espace → « ctrl+space ») ; un modificateur pressé
      // seul reste utilisable tel quel (« ctrl »)
      const MODS=['ctrl','alt','shift','windows'];
      if(MODS.indexOf(k)<0){
        const held=[];
        if(e.ctrlKey)held.push('ctrl');
        if(e.altKey)held.push('alt');
        if(e.shiftKey)held.push('shift');
        if(e.metaKey)held.push('windows');
        if(held.length)k=held.join('+')+'+'+k;
      }
      el.value=k;set(k);}});
}

// ---------- menus ----------
document.getElementById('modesBtn').onclick=()=>{const m=document.getElementById('modes');const open=!m.classList.contains('on');m.classList.toggle('on');if(open)renderModes();api('panel','modes',open).then(reportShape);};
// couleurs pastel (dérivées du thème de l'orbe) + icônes SVG monochromes — zéro emoji
const MC={auto:'#C7B9EA',voice_to_text:'#AEBEEC',email:'#F0D3A8',prompt_engineer:'#E9B8CE',

// confirmation façon macOS (promesse) — utilisée avant les actions à impact.
// Réentrance verrouillée : une seule modale à la fois (un 2e appel résout
// « annulé » sans empiler) ; Échap annule ; clic sur le fond annule.
let _confirmOpen=false;
function askConfirm(title,body,ok,cancel){
  if(_confirmOpen)return Promise.resolve(false);
  _confirmOpen=true;
  return new Promise(res=>{
    const m=document.createElement('div');m.className='cmask';
    m.innerHTML='<div class="cbox"><b>'+esc(title)+'</b><p>'+esc(body)+'</p><div class="cbtns">'+
      '<button class="btn sec" id="cNo">'+esc(cancel)+'</button>'+
      '<button class="btn" id="cYes">'+esc(ok)+'</button></div></div>';
    document.body.appendChild(m);
    const done=v=>{m.remove();document.removeEventListener('keydown',onKey);
      _confirmOpen=false;res(v);};
    const onKey=e=>{if(e.key==='Escape')done(false);
      else if(e.key==='Enter')done(true);};
    document.addEventListener('keydown',onKey);
    m.querySelector('#cNo').onclick=()=>done(false);
    m.querySelector('#cYes').onclick=()=>done(true);
    m.onclick=e=>{if(e.target===m)done(false);};
    m.querySelector('#cYes').focus();
  });
}

    api('save_custom_modes',arr).then(r=>{if(r&&r.ok){S.custom_modes=r.custom_modes||[];buildPane();}});};});
  document.getElementById('cmAdd').onclick=()=>{
    const name=document.getElementById('cmName').value.trim(),
          match=document.getElementById('cmMatch').value.split(',').map(s=>s.trim()).filter(Boolean),
          prompt=document.getElementById('cmPrompt').value.trim();
    if(!name||!match.length||!prompt)return;
    api('save_custom_modes',(S.custom_modes||[]).concat([{name:name,match:match,prompt:prompt}])).then(r=>{
      if(r&&r.ok){S.custom_modes=r.custom_modes||[];buildPane();}});};
}

function paneLang(p){
  let opts='';(S.languages||[]).forEach(l=>{opts+='<option value="'+l.code+'"'+
    (l.code===S.language?' selected':'')+'>'+esc(l.label)+'</option>';});
  let vars='';(S.custom_vars||[]).forEach((v,i)=>{vars+='<div class="row"><div class="l"><b>'+esc(v.trigger)+
    '</b><small>→ '+esc(v.value)+'</small></div><div class="r"><button class="xdel" data-i="'+i+
    '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>';});
  const add='<div class="row"><input class="fieldc" id="vT" placeholder="quand je dis…" style="width:140px">'+
    '<input class="fieldc" id="vV" placeholder="texte collé" style="flex:1"><button class="btn" id="vAdd">Ajouter</button></div>';
  p.innerHTML='<h1>Langue &amp; dictée</h1>'
   +G('Langue',R('Langue de dictée','« Auto » détecte la langue parlée',
      '<select class="fieldc" id="langSel2">'+opts+'</select>'),
      'Toutes les langues sont incluses, quel que soit le palier.')
   +G('Raccourcis vocaux',add+vars,'« Quand je dis X, colle Y » — 100 % privé, jamais envoyé à une IA.');
  document.getElementById('langSel2').onchange=e=>{S.language=e.target.value;api('set_language',e.target.value);};
  document.getElementById('vAdd').onclick=()=>{const t=document.getElementById('vT').value.trim(),
    v=document.getElementById('vV').value.trim();if(!t||!v)return;
    api('save_custom_vars',(S.custom_vars||[]).concat([{trigger:t,value:v}])).then(r=>{
      S.custom_vars=r||S.custom_vars;buildPane();});};
  p.querySelectorAll('.xdel').forEach(b=>{b.onclick=()=>{const arr=(S.custom_vars||[]).slice();arr.splice(+b.dataset.i,1);
    api('save_custom_vars',arr).then(r=>{S.custom_vars=r||arr;buildPane();});};});
}

function paneInfos(p){
  const F=[['prenom','Prénom'],['nom','Nom'],['email','E-mail'],['telephone','Téléphone'],['adresse','Adresse']];
  let rows='';F.forEach(([k,lb])=>{rows+=R(lb,'','<input class="fieldc" data-k="'+k+
    '" style="width:230px;text-align:right" value="'+esc((S.personal||{})[k]||'')+'">');});
  // informations personnalisées : autant de paires « ce que je dis » → valeur
  // que voulu (ex. « ma plaque » → AB-123-CD), substituées comme les champs fixes
  const extras=((S.personal||{}).extra||[]).slice();
  const exRow=(e)=>'<div class="row xrow"><input class="fieldc xlab" placeholder="Ce que je dis (ex. ma plaque)"'+
    ' style="width:190px" value="'+esc(e.label||'')+'"><div class="r" style="flex:1">'+
    '<input class="fieldc xval" placeholder="Remplacé par…" style="flex:1;text-align:right" value="'+esc(e.value||'')+'">'+
    '<button class="xdel" title="Supprimer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>';
  p.innerHTML='<h1>Mes infos</h1>'
   +G('Profil',rows,'Pour « mon adresse », « mon e-mail »… — substitué localement, jamais envoyé à une IA.')
   +G('Informations personnalisées','<div id="xtras">'+extras.map(exRow).join('')+'</div>'+
      '<div class="row"><button class="btn sec" id="meAdd">Ajouter une information</button></div>',
      'Dites le libellé en dictant, Nova le remplace par la valeur. Exemple : « ma plaque » → AB-123-CD.')
   +'<button class="btn" id="meSave">Enregistrer</button>';
  const wireDel=()=>{p.querySelectorAll('.xrow .xdel').forEach(b=>{b.onclick=()=>b.closest('.xrow').remove();});};
  wireDel();
  document.getElementById('meAdd').onclick=()=>{
    document.getElementById('xtras').insertAdjacentHTML('beforeend',exRow({}));wireDel();};
  document.getElementById('meSave').onclick=()=>{const o={};
    p.querySelectorAll('input[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());
    o.extra=[...p.querySelectorAll('.xrow')].map(r=>({label:r.querySelector('.xlab').value.trim(),
      value:r.querySelector('.xval').value.trim()})).filter(e=>e.label&&e.value);
    api('save_personal',o).then(r=>{S.personal=r||o;buildPane();});};
}

// ---------- bille de verre (WebGL transparent) : intérieur vivant réfracté, réactif à l'état + voix ----------
const ORB=(function(){
  const cv=document.getElementById('orb');const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:true});
  const ACC={repos:[0.56,0.64,0.85],listening:[0.42,0.70,1.0],thinking:[0.76,0.70,0.93],ok:[0.58,0.87,0.71],error:[0.90,0.62,0.42]};
  const MODE={repos:0,listening:1,thinking:2,ok:3,error:0};
  let state='repos',micTgt=0,level=0,sPos=0,sVel=0,pulse=0,tgtA=ACC.repos,curA=ACC.repos.slice(),accentOverride=null;
  if(!gl){cv.style.cssText+='background:radial-gradient(38% 34% at 40% 32%,#fff,#aab3c6 78%,#7c8496);border-radius:50%';return{setState(s){state=s;},level(){},setAccent(){}}; }
  const F=`precision highp float;uniform vec2 uRes;uniform float uT,uVol,uSwell,uPulse;uniform int uMode;uniform vec3 uAcc;
  float hs(vec3 p){p=fract(p*0.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  float nz(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
   return mix(mix(mix(hs(i),hs(i+vec3(1,0,0)),f.x),mix(hs(i+vec3(0,1,0)),hs(i+vec3(1,1,0)),f.x),f.y),
              mix(mix(hs(i+vec3(0,0,1)),hs(i+vec3(1,0,1)),f.x),mix(hs(i+vec3(0,1,1)),hs(i+vec3(1,1,1)),f.x),f.y),f.z);}
  float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*nz(p);p=p*2.03+vec3(1.7);a*=.5;}return s;}
  vec3 iris(float x){vec3 c=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.66)+x));return mix(vec3(0.80,0.85,0.96),c,0.30);}
  void main(){
   vec2 uv=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);float t=uT;
   vec2 q=vec2(uv.x,uv.y/1.05);float ang=atan(q.y,q.x);float r=length(q);
   float v=clamp(uVol,0.0,1.0);float act=smoothstep(0.02,0.16,v);float react=act*(0.60+0.40*v);
   float disp=(0.024*sin(3.0*ang+t*0.6)+0.017*sin(5.0*ang-t*1.0)+0.011*sin(2.0*ang+t*0.45))*(0.32+1.55*react);
   float R=(0.30+0.05*uSwell+0.07*uPulse)*(1.0+disp);
   vec3 col=vec3(0.);float alpha=0.0;
   if(r<R){
    float z=sqrt(max(R*R-r*r,0.0));vec3 N=normalize(vec3(q,z));vec3 V=vec3(0.,0.,1.);
    float rp=sin(r*20.0-t*(3.0+5.5*react));
    N.xy+=(0.016+0.11*react)*vec2(cos(ang),sin(ang))*rp;N=normalize(N);
    vec3 L=normalize(vec3(-0.4,0.55,0.8));vec3 Hh=normalize(L+V);vec3 rd=refract(-V,N,0.80);
    float spin=(uMode==2)?t*1.5:0.0;float cs=cos(spin),sn=sin(spin);vec2 qi=vec2(cs*q.x-sn*q.y,sn*q.x+cs*q.y);
    float ft=t*(0.16+2.4*react+(uMode==2?0.7:0.0));
    vec2 f1=vec2(fbm(vec3(qi*1.6+vec2(0.0,ft*0.10),ft*0.18)),fbm(vec3(qi*1.6+vec2(5.0,-ft*0.09),ft*0.18)))-0.5;
    vec2 f2=vec2(fbm(vec3(qi*3.1+f1*0.6+vec2(ft*0.10,0.0),ft*0.30)),fbm(vec3(qi*3.1+f1*0.6+vec2(9.0,-ft*0.11),ft*0.30)))-0.5;
    float d1=fbm(vec3((qi+rd.xy*0.42+f1*0.46)*3.0, ft*0.55));
    float d2=fbm(vec3((qi+rd.xy*0.90+f2*0.72)*3.6+3.3, ft*0.78+2.0));
    float dens=mix(d1,d2,0.5);
    vec3 interior=iris(dens*0.85+N.y*0.12+ft*0.05+f1.x*0.40);
    interior=mix(interior,uAcc,0.26);interior*=(0.5+0.85*smoothstep(0.14,0.95,dens+0.14*f2.y));
    float fres=pow(1.0-max(N.z,0.0),2.6);vec3 rim=mix(vec3(0.86,0.91,1.0),uAcc,0.35);
    float sp=pow(max(dot(N,Hh),0.0),90.0)*0.9+pow(max(dot(N,Hh),0.0),420.0)*0.75;
    col=mix(interior,rim,fres*0.55)+sp;col+=uAcc*fres*(0.12+0.5*react);
    if(uMode==2){float th=t*2.2;vec2 cpt=vec2(cos(th),sin(th))*R*0.62;float dc=length(q-cpt);
     col+=(uAcc*0.9+0.22)*exp(-dc*dc*70.0)*(0.65+0.35*sin(t*3.0));}
    col=col/(1.0+col*0.5);alpha=smoothstep(R,R-0.008,r);
   }
   float glow=smoothstep(R*1.55,R,r);float e=(uMode==3)?max(react,uPulse):react;
   col+=uAcc*glow*glow*(0.05+0.24*e);alpha=max(alpha,glow*glow*(0.4+0.6*e));
   gl_FragColor=vec4(pow(max(col,0.0),vec3(0.90)),clamp(alpha,0.0,1.0));}`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  const uR=gl.getUniformLocation(pr,'uRes'),uT=gl.getUniformLocation(pr,'uT'),uV=gl.getUniformLocation(pr,'uVol'),
        uSw=gl.getUniformLocation(pr,'uSwell'),uP=gl.getUniformLocation(pr,'uPulse'),uM=gl.getUniformLocation(pr,'uMode'),uA=gl.getUniformLocation(pr,'uAcc');
  const DPR=Math.min(2,devicePixelRatio||1),t0=performance.now();
  function fit(){const r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*DPR);cv.height=Math.max(1,r.height*DPR);gl.viewport(0,0,cv.width,cv.height);}
  fit();addEventListener('resize',fit);
  const SETEL=document.getElementById('settings');
  let covered=false;
  (function f(now){const t=(now-t0)/1000;
    // réglages ouverts : #settings couvre tout le dock → on saute le rendu GL
    if(SETEL.classList.contains('on')){covered=true;requestAnimationFrame(f);return;}
    // au retour, on repart d'un état transitoire posé : une pulsation « succès »
    // ou un niveau micro reçus pendant les réglages ne sont pas rejoués en retard
    if(covered){covered=false;pulse=0;micTgt=0;level=0;sVel=0;sPos=0;
      for(let i=0;i<3;i++)curA[i]=tgtA[i];}
    // le micro ne pilote le volume QU'EN écoute ; sinon l'anim est intrinsèque (repos/traitement/succès)
    const target=(state==='listening')?micTgt:0;
    level+=(target-level)*(target>level?0.30:0.10);
    sVel+=(level-sPos)*0.14;sVel*=0.80;sPos+=sVel;
    micTgt*=0.90;pulse*=0.95;
    for(let i=0;i<3;i++)curA[i]+=(tgtA[i]-curA[i])*0.08;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t);gl.uniform1f(uV,level);gl.uniform1f(uSw,sPos);
    gl.uniform1f(uP,pulse);gl.uniform1i(uM,MODE[state]||0);gl.uniform3fv(uA,curA);
    gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(f);})(t0);
  return {setState(s){state=s;tgtA=accentOverride||ACC[s]||ACC.repos;if(s==='ok'||s==='error')pulse=1.0;},
          level(rms){micTgt=Math.min(1,rms*12);},
          setAccent(rgb){accentOverride=rgb;tgtA=rgb||ACC[state]||ACC.repos;}};
})();

// Personnalisation Ultra : couleur d'orbe « #rrggbb » → accent partagé.
function hexToRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec((h||'').trim());if(!m)return null;
  const n=parseInt(m[1],16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function applyOrbColor(h){ORB.setAccent(hexToRgb(h));}

// ---------- init ----------
function init(){api('state').then(st=>{if(st){S=Object.assign(S,st);if(S.orb_color)applyOrbColor(S.orb_color);}
  applyDockPrefs();   // ancrage + taille + PREMIER rapport de formes → révèle la fenêtre
});}
window.addEventListener('pywebviewready',init);
setTimeout(()=>{init();},500);
</script>
